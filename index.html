<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<meta name="author" content="Вовненко Ярослав Віталійович">
<title>Місія: Врятувати Інтернет</title>
<style>
  :root {
    --bg1:#14123a; --bg2:#2a1a5e; --card:rgba(255,255,255,.08); --card2:rgba(255,255,255,.14); --line:rgba(255,255,255,.18);
    --ink:#f4f6ff; --muted:#b9bfe6; --cyan:#22d3ee; --pink:#f472b6; --yellow:#fde047; --green:#4ade80; --purple:#a78bfa; --orange:#fb923c; --red:#fb7185;
    --accent:#22d3ee; --accent-ink:#06222b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: #1d1650; }
  body::after { content:""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
  body { margin:0; color: var(--ink); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; font-size: 17px;
         min-height: 100vh; min-height: 100dvh; overflow-x: hidden; position: relative; touch-action: manipulation; }
  body::before { content:""; position: fixed; inset: -50% -50%; z-index: 0; pointer-events:none; opacity:.8;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 140px 90px, #cfd8ff, transparent),
      radial-gradient(1.5px 1.5px at 80px 160px, #fff, transparent), radial-gradient(2px 2px at 200px 40px, #ffe7a3, transparent),
      radial-gradient(1.5px 1.5px at 260px 140px, #fff, transparent);
    background-size: 300px 220px; animation: drift 120s linear infinite; }
  @keyframes drift { to { transform: translate3d(-300px, -220px, 0); } }
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  h1 { font-size: 1.7rem; line-height: 1.15; margin: 4px 0 6px; }
  h2 { font-size: 1.35rem; margin: 6px 0 10px; }
  h3 { margin: 0 0 6px; font-size: 1.1rem; }
  p { margin: 0 0 10px; }
  .lead { color: var(--muted); }
  .muted { color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:12px; }
  .ico { display:inline-block; width: 48px; height: 48px; flex: none; color: var(--c, #fff); }
  .ico svg { width:100%; height:100%; display:block; }
  .ico.lg { width: 72px; height: 72px; } .ico.sm { width: 38px; height: 38px; }
  .stars { font-size: 1.5rem; letter-spacing: 2px; color: var(--yellow); white-space: nowrap; text-shadow: 0 0 10px rgba(253,224,71,.5); }
  .stars .off { color: rgba(255,255,255,.2); text-shadow:none; }
  .stars .pop { display:inline-block; animation: pop .5s ease both; }
  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  button { font: inherit; }
  .btn { font-weight: 700; padding: 13px 20px; border-radius: 14px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); min-height: 50px; box-shadow: 0 4px 0 rgba(0,0,0,.28); transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
  .btn.alt { background: var(--card2); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .btn.ok { background: var(--green); color:#052e14; } .btn.bad { background: var(--red); color:#3a0512; }
  .btn.big { width: 100%; font-size: 1.1rem; }
  .btn:disabled { opacity: .45; cursor: default; }
  input[type=text], input[type=password], select { font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.28); color: var(--ink); min-width: 0; flex: 1 1 140px; min-height: 50px; }
  select option { color: #111; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; }
  .hero { display:flex; align-items:center; gap:12px; }
  .hero svg.net { width: 100%; max-width: 760px; display:block; margin: 0 auto 6px; }

  /* Mascot */
  .mascot { display:flex; align-items:flex-end; gap:10px; margin: 6px 0 12px; }
  .mascot svg { width: 84px; height: 96px; flex: none; }
  .bubble { position: relative; background: #fff; color:#1b1740; padding: 10px 14px; border-radius: 16px; font-weight: 600; flex: 1; }
  .bubble::before { content:""; position:absolute; left:-8px; bottom: 16px; border: 8px solid transparent; border-right-color:#fff; border-left:0; }
  .eye { transform-origin: center; animation: blink 4.5s infinite; } @keyframes blink { 0%,94%,100% { transform: scaleY(1);} 97% { transform: scaleY(.1);} }
  .ant { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.35; } }
  .bob { animation: bob 3s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-4px); } }

  /* Level cards (menu) */
  .lv { display:flex; align-items:center; gap:12px; width:100%; text-align:left; color: var(--ink); background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 12px; cursor:pointer; min-height: 76px; }
  .lv:active { transform: scale(.985); }
  .lv .badge { width: 58px; height: 58px; border-radius: 16px; display:flex; align-items:center; justify-content:center; flex:none; background: var(--bgc); }
  .lv .badge .ico { width: 38px; height: 38px; color: #12102e; }
  .lv b { display:block; font-size: 1.05rem; } .lv small { color: var(--muted); display:block; line-height:1.25; }
  .lv .meta { margin-left:auto; text-align:right; }
  .lv .stars { font-size: 1.25rem; }
  .xp { height: 14px; background: rgba(0,0,0,.35); border-radius: 8px; overflow:hidden; border:1px solid var(--line); }
  .xp > i { display:block; height:100%; background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow)); transition: width .5s; }

  /* Carousel */
  .car { position: relative; margin: 4px -14px 12px; }
  .car-track { display:flex; overflow-x:auto; scroll-snap-type: x mandatory; gap: 12px; padding: 4px 14px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .car-track::-webkit-scrollbar { display:none; }
  .slide { flex: 0 0 88%; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 12px 14px; }
  .slide svg.art, .slide .media { width: 100%; height: auto; display:block; border-radius: 14px; background: rgba(0,0,0,.28); margin-bottom: 8px; }
  .slide .media { aspect-ratio: 16/9; object-fit: cover; }
  .slide p { font-size: .98rem; margin: 0 0 6px; }
  .dots { display:flex; justify-content:center; gap:8px; margin-top: 2px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.28); transition: all .2s; }
  .dots i.on { background: var(--cyan); width: 22px; border-radius: 6px; }
  .car-nav { display:flex; justify-content:space-between; align-items:center; padding: 0 14px; }
  .vids { display:grid; gap:10px; }
  a.vid { display:flex; gap:12px; align-items:center; color: var(--ink); text-decoration:none; background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-height: 64px; }
  a.vid .play { width: 44px; height: 44px; border-radius: 50%; background: var(--red); display:flex; align-items:center; justify-content:center; flex:none; }
  a.vid .play::after { content:""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
  a.vid small { color: var(--muted); display:block; }

  /* Game pieces */
  .bigq { font-size: 1.2rem; font-weight: 700; display:flex; align-items:center; gap: 12px; min-height: 100px; }
  .fb { min-height: 28px; font-weight: 700; margin: 10px 0; }
  .fb.ok { color: var(--green); } .fb.bad { color: var(--red); }
  .bar { height: 12px; background: rgba(0,0,0,.35); border-radius: 8px; overflow:hidden; margin: 6px 0 12px; }
  .bar > i { display:block; height:100%; width:100%; background: linear-gradient(90deg, var(--green), var(--yellow), var(--red)); background-size: 300% 100%; transition: width .1s linear; }
  .tile { background: var(--card2); border:2px solid var(--line); border-radius:14px; padding:10px 12px; cursor:pointer; color: var(--ink); text-align:left; min-height: 58px; display:flex; align-items:center; gap:10px; font-weight: 600; }
  .tile.col { flex-direction: column; justify-content:center; text-align:center; }
  .tile.sel { background: rgba(253,224,71,.22); border-color: var(--yellow); }
  .tile.done { border-color: var(--green); background: rgba(74,222,128,.14); opacity:.8; cursor: default; }
  .tile.wrong { animation: shake .35s; border-color: var(--red); }
  .tile .n { display:inline-flex; align-items:center; justify-content:center; min-width: 28px; height: 28px; border-radius: 50%; background: var(--yellow); color:#3a2c00; font-weight:800; flex:none; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .cats { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top: 12px; }
  .cat { border:2px dashed var(--cyan); border-radius:14px; padding:14px 8px; text-align:center; font-weight:800; cursor:pointer; background: rgba(34,211,238,.1); color: var(--ink); min-height: 60px; }
  .items { display:flex; flex-wrap:wrap; gap:8px; }
  .items .tile { text-align:center; justify-content:center; }
  .gradebox { text-align:center; }
  .grade { font-size: 4.6rem; font-weight: 900; line-height: 1; background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rank { font-size: 1.7rem; font-weight: 800; margin: 4px 0 8px; }
  .srow { display:flex; justify-content:space-between; align-items:center; gap:8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
  .tabs .btn { flex: 1 1 60px; padding: 10px; }
  .tabs .btn.on { background: var(--accent); color: var(--accent-ink); }
  .tbl { width:100%; border-collapse: collapse; font-size: .98rem; }
  .tbl th, .tbl td { text-align:left; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .tbl tr.me td { background: rgba(34,211,238,.18); font-weight: 800; }
  .medal { font-weight: 900; }
  .warn { background: rgba(253,224,71,.18); border: 1px solid var(--yellow); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  footer { color: var(--muted); font-size: .85rem; text-align:center; padding: 16px 0 10px; }
  footer a { color: var(--muted); }
  .credit { color: var(--ink); font-weight: 700; }
  #confetti { position: fixed; inset:0; z-index: 50; pointer-events:none; }
  @media (max-width: 420px) { body { font-size: 16.5px; } h1 { font-size: 1.5rem; } .slide { flex-basis: 90%; } .grade { font-size: 4rem; } .tabs .btn { font-size: .95rem; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
'use strict';
/* ===== НАЛАШТУВАННЯ =====
   API_URL — адреса веб-застосунку Google Apps Script (див. leaderboard_backend.gs).
   Порожньо = гра працює, але без таблиці лідерів і без надсилання результатів. */
var API_URL = window.IMI_API_URL || '';
var CLASSES = ['5-А', '5-Б', '5-В', '5-Г'];
/* Власні фото й відео для каруселі. Поклади файли в папку media поруч з index.html і додай рядки:

var MEDIA = [];
/* Відео за посиланням (відкриваються на YouTube). Перед уроком перегляньте їх самі. */
var VIDEOS = [
  { title: 'Як працює Інтернет', note: 'Відео для 5 класу', url: 'https://www.youtube.com/watch?v=a3BkZ6RoNII' },
  { title: 'Що таке штучний інтелект і навіщо він потрібен?', note: 'Пояснення простими словами', url: 'https://www.youtube.com/watch?v=4GnM_K9pKs4' },
  { title: 'Мультфільм «Про безпеку в Інтернеті»', note: 'Сторінка на «Всеосвіті»', url: 'https://vseosvita.ua/library/multfilm-pro-bezpeku-v-interneti-440966.html' }
];

/* ===== Допоміжні ===== */
function $(sel, root) { return (root || document).querySelector(sel); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function h(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (attrs[k] == null) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }
function sstore(key, val) { try { if (val === undefined) return sessionStorage.getItem(key); sessionStorage.setItem(key, val); } catch (e) { return null; } }
function starsFor(score, max) { var r = max ? score / max : 0; return r >= 0.9 ? 3 : r >= 0.6 ? 2 : r > 0 ? 1 : 0; }
function starsHtml(n, animate) {
  var s = h('span', { class: 'stars', 'aria-label': n + ' з 3 зірок' });
  for (var i = 0; i < 3; i++) { var st = h('span', { class: (i < n ? '' : 'off') + (animate && i < n ? ' pop' : ''), text: '★' }); if (animate && i < n) st.style.animationDelay = (i * 0.25) + 's'; s.appendChild(st); }
  return s;
}

/* ===== Іконки (власні SVG) ===== */
var S = 'fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
var ICONS = {
  phone: '<rect x="20" y="7" width="24" height="50" rx="5"/><line x1="28" y1="50" x2="36" y2="50"/><line x1="28" y1="13" x2="36" y2="13"/>',
  cpu: '<rect x="18" y="18" width="28" height="28" rx="3"/><rect x="26" y="26" width="12" height="12"/><path d="M26 10v8M32 10v8M38 10v8M26 46v8M32 46v8M38 46v8M10 26h8M10 32h8M10 38h8M46 26h8M46 32h8M46 38h8"/>',
  ram: '<rect x="6" y="18" width="52" height="24" rx="2"/><rect x="12" y="24" width="8" height="12"/><rect x="24" y="24" width="8" height="12"/><rect x="36" y="24" width="8" height="12"/><path d="M12 42v8M20 42v8M28 42v8M36 42v8M44 42v8M52 42v8"/>',
  router: '<rect x="6" y="36" width="52" height="16" rx="4"/><circle cx="18" cy="44" r="2"/><circle cx="26" cy="44" r="2"/><path d="M16 36L12 14M48 36l4-22M24 24q8-8 16 0M20 17q12-12 24 0"/>',
  provider: '<rect x="14" y="26" width="36" height="30" rx="2"/><path d="M22 34h6M36 34h6M22 44h6M36 44h6M32 26V10M24 16q8-8 16 0"/>',
  fiber: '<path d="M4 44C16 18 26 62 40 32S54 22 60 20"/><path d="M4 36C16 12 26 54 40 26S54 16 60 14" stroke-dasharray="3 6"/>',
  dns: '<rect x="4" y="18" width="22" height="28" rx="3"/><rect x="38" y="18" width="22" height="28" rx="3"/><path d="M28 32h8M33 28l4 4-4 4"/><text x="15" y="36" font-size="11" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial">abc</text><text x="49" y="36" font-size="9" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial">192</text>',
  server: '<rect x="10" y="8" width="44" height="14" rx="3"/><rect x="10" y="25" width="44" height="14" rx="3"/><rect x="10" y="42" width="44" height="14" rx="3"/><circle cx="18" cy="15" r="2"/><circle cx="18" cy="32" r="2"/><circle cx="18" cy="49" r="2"/><path d="M30 15h18M30 32h18M30 49h18"/>',
  browser: '<rect x="5" y="10" width="54" height="44" rx="5"/><path d="M5 22h54"/><circle cx="12" cy="16" r="1.5"/><circle cx="18" cy="16" r="1.5"/><rect x="26" y="13" width="28" height="6" rx="3"/><path d="M12 32h24M12 40h34"/>',
  doc: '<path d="M16 6h22l10 10v42H16z"/><path d="M38 6v10h10M22 28h20M22 36h20M22 44h14"/>',
  screen: '<rect x="6" y="10" width="52" height="34" rx="3"/><path d="M26 54h12M32 44v10"/><circle cx="22" cy="24" r="4"/><path d="M12 40l12-10 8 6 10-10 10 14"/>',
  globe: '<circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32h48M12 20h40M12 44h40"/>',
  magnifier: '<circle cx="27" cy="27" r="16"/><path d="M39 39l17 17"/>',
  bolt: '<polygon points="36,5 15,36 30,36 26,59 49,26 34,26" fill="currentColor"/>',
  shield: '<path d="M32 6l20 8v18c0 14-10 22-20 26C22 54 12 46 12 32V14z"/><path d="M22 32l8 8 14-16"/>',
  puzzle: '<path d="M10 20h14a6 6 0 1 1 12 0h14v14a6 6 0 1 0 0 12v10H36a6 6 0 1 0-12 0H10V46a6 6 0 1 0 0-12z"/>',
  sort: '<rect x="6" y="8" width="20" height="20" rx="3"/><rect x="38" y="8" width="20" height="20" rx="3"/><rect x="6" y="38" width="20" height="20" rx="3"/><rect x="38" y="38" width="20" height="20" rx="3"/>'
};
function ico(name, size, color) {
  var e = h('span', { class: 'ico ' + (size || ''), html: '<svg viewBox="0 0 64 64" ' + S + ' aria-hidden="true">' + (ICONS[name] || ICONS.globe) + '</svg>' });
  if (color) e.style.setProperty('--c', color);
  return e;
}

/* ===== Талісман «Біт» ===== */
function mascotSvg(mood) {
  var mouth = mood === 'sad' ? 'M36 62 Q42 56 48 62' : mood === 'wow' ? 'M38 60 Q42 70 46 60 Z' : 'M34 60 Q42 70 50 60';
  return '<svg viewBox="0 0 84 96" aria-hidden="true">' +
    '<g class="bob"><line x1="42" y1="12" x2="42" y2="24" stroke="#cfd8ff" stroke-width="3" stroke-linecap="round"/>' +
    '<circle class="ant" cx="42" cy="9" r="6" fill="#fde047"/>' +
    '<rect x="14" y="24" width="56" height="50" rx="16" fill="#22d3ee"/><rect x="20" y="30" width="44" height="38" rx="12" fill="#12102e"/>' +
    '<g class="eye"><circle cx="32" cy="46" r="7" fill="#fff"/><circle cx="33" cy="47" r="3.2" fill="#12102e"/></g>' +
    '<g class="eye"><circle cx="52" cy="46" r="7" fill="#fff"/><circle cx="53" cy="47" r="3.2" fill="#12102e"/></g>' +
    '<path d="' + mouth + '" fill="' + (mood === 'wow' ? '#f472b6' : 'none') + '" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<rect x="26" y="76" width="32" height="14" rx="6" fill="#a78bfa"/><circle cx="12" cy="52" r="5" fill="#a78bfa"/><circle cx="72" cy="52" r="5" fill="#a78bfa"/></g></svg>';
}
function mascot(text, mood) {
  var svg = h('div', { html: mascotSvg(mood || 'happy') }), bub = h('div', { class: 'bubble', 'aria-live': 'polite', text: text });
  var el = h('div', { class: 'mascot' }, [svg, bub]);
  el.say = function (t, m) { svg.innerHTML = mascotSvg(m || 'happy'); bub.textContent = t; };
  return el;
}

/* ===== Конфеті ===== */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = $('#confetti'), ctx = c.getContext('2d'); if (!ctx) return;
  c.width = innerWidth; c.height = innerHeight;
  var colors = ['#22d3ee', '#f472b6', '#fde047', '#4ade80', '#a78bfa', '#fb923c'];
  var ps = []; for (var i = 0; i < 110; i++) ps.push({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: colors[i % colors.length] });
  var t0 = Date.now();
  (function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (Date.now() - t0 < 2800) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);

  { title: 'Які це системи?', icon: 'server', cats: ['Біологічні', 'Технічні', 'Соціальні'], items: [['Мурашник', 0], ['Клітина', 0], ['Ноутбук', 1], ['Роутер', 1], ['Шкільний клас', 2], ['Фан-клуб', 2]] },
  { title: 'Дані чи повідомлення за органами чуття?', icon: 'doc', cats: ['Типи даних', 'Повідомлення (органи чуття)'], items: [['Текстові', 0], ['Числові', 0], ['Відео', 0], ['Нюхові', 1], ['Смакові', 1], ['Слухові', 1]] }
];
function playSort(done) {
  var r = 0, score = 0, selected = null, penal = {}, stage = h('div');
  function round() {
    var R = SORT_ROUNDS[r], remaining = shuffle(R.items.map(function (it, i) { return { t: it[0], c: it[1], i: i }; })); selected = null; penal = {};
    function draw() {
      stage.innerHTML = '';
      stage.appendChild(h('div', { class: 'muted', text: 'Крок ' + (r + 1) + ' з ' + SORT_ROUNDS.length + ' · правильно: ' + score }));
      stage.appendChild(h('div', { class: 'card' }, [h('div', { class: 'row' }, [ico(R.icon, '', '#fde047'), h('div', { style: 'flex:1' }, [h('b', { text: R.title }), h('div', { class: 'muted', text: 'Натисни картку, потім категорію.' })])])]));
      var items = h('div', { class: 'items' });
      remaining.forEach(function (it) { items.appendChild(h('button', { class: 'tile' + (selected === it ? ' sel' : ''), text: it.t, onclick: function () { selected = (selected === it) ? null : it; draw(); } })); });
      stage.appendChild(items);
      var cats = h('div', { class: 'cats' });
      R.cats.forEach(function (name, ci) {
        cats.appendChild(h('button', { class: 'cat', text: name, onclick: function () {
          if (!selected) return;
          if (selected.c === ci) {
            if (!penal[selected.i]) score++;
            remaining = remaining.filter(function (x) { return x !== selected; }); selected = null;
            if (!remaining.length) { r++; if (r >= SORT_ROUNDS.length) { done(score); return; } round(); return; }
          } else { penal[selected.i] = true; }
          draw();
        } }));
      });
      stage.appendChild(cats);
    }
    draw();
  }
  render([levelTop('Сортувальник'), stage]); round();
}

/* ===== Рівень 5. Бос: Блискавка ===== */
var BLITZ = [
  ['Повідомлення стає інформацією, коли його розуміє одержувач.', true], ['Оперативна пам\'ять зберігає дані після вимкнення живлення.', false],
  ['Процесор керує іншими пристроями комп\'ютера.', true], ['Wi-Fi — це дротовий спосіб передавання даних.', false], ['Оптоволокно передає світлові сигнали.', true],
  ['DNS перетворює адресу сайту на цифрову.', true], ['WWW — це весь Інтернет, інших служб немає.', false], ['Провайдер надає доступ до Інтернету.', true],
  ['Браузер — це те саме, що пошукова система.', false], ['Електронна пошта — служба Інтернету.', true], ['Сканер виводить зображення на папір.', false],
  ['Блокчейн записує операції в «ланцюжок блоків».', true], ['Мурашник — це соціальна система.', false], ['Сервер виконує запити клієнтів.', true]
];
function playBlitz(done) {
  var qs = shuffle(BLITZ).slice(0, 10), i = 0, score = 0, lives = 3, locked = false, left = 8, TOTAL = 8, box = h('div');
  function end() { stopTimers(); done(score); }
  function next() { i++; if (i >= qs.length || lives <= 0) end(); else show(); }
  function show() {
    stopTimers(); locked = false; left = TOTAL;
    var q = qs[i], bar = h('i'), fb = h('div', { class: 'fb', 'aria-live': 'polite' });
    function answer(val, timeout) {
      if (locked) return; locked = true; stopTimers(); var ok = !timeout && val === q[1]; if (ok) score++; else lives--;
      fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.textContent = ok ? 'Так!' : (timeout ? 'Час вийшов. ' : 'Ні. ') + 'Правильна відповідь: ' + (q[1] ? 'правда' : 'неправда') + '.'; setTimeout(next, 1100);
    }
    var hearts = ''; for (var k = 0; k < 3; k++) hearts += k < lives ? '♥ ' : '♡ ';
    box.innerHTML = '';
    [h('div', { class: 'row', style: 'justify-content:space-between' }, [h('span', { class: 'muted', text: 'Питання ' + (i + 1) + ' з ' + qs.length + ' · правильно: ' + score }), h('b', { style: 'color:var(--red);font-size:1.3rem', text: hearts })]),
     h('div', { class: 'bar' }, [bar]), h('div', { class: 'card bigq' }, [ico('bolt', 'lg', '#fb923c'), h('span', { text: q[0] })]),
     h('div', { class: 'row' }, [h('button', { class: 'btn ok', style: 'flex:1', text: 'Правда', onclick: function () { answer(true, false); } }), h('button', { class: 'btn bad', style: 'flex:1', text: 'Неправда', onclick: function () { answer(false, false); } })]), fb].forEach(function (n) { box.appendChild(n); });
    timers.push(setInterval(function () { left -= 0.1; bar.style.width = Math.max(0, left / TOTAL * 100) + '%'; if (left <= 0) answer(null, true); }, 100));
  }
  render([levelTop('Бос: Блискавка'), h('p', { class: 'lead', text: 'На кожне твердження — 8 секунд і три життя. Не зупиняйся, агенте!' }), box]); show();
}

route();
