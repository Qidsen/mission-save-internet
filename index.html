<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2335e0f0%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2216%22 fill=%22none%22 stroke=%22%2304252c%22 stroke-width=%225%22/%3E%3Cpath d=%22M16 32h32M32 16c-8 9-8 23 0 32M32 16c8 9 8 23 0 32%22 fill=%22none%22 stroke=%22%2304252c%22 stroke-width=%224%22/%3E%3C/svg%3E">
<meta name="author" content="Вовненко Ярослав Віталійович">
<title>Місія: Врятувати Інтернет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1:#0f0c31; --bg2:#251b62; --card:rgba(255,255,255,.065); --card2:rgba(255,255,255,.12); --line:rgba(190,200,255,.17); --line-hi:rgba(190,200,255,.32);
    --ink:#f5f6ff; --muted:#b7bce8; --cyan:#35e0f0; --pink:#ff74b8; --yellow:#ffd84a; --green:#58e39a; --purple:#a78bfa; --orange:#ff9a4d; --red:#ff6f8a;
    --accent:#35e0f0; --accent-ink:#04252c; --accent-deep:#0f8796;
    --display: "Unbounded", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg1); }
  body { margin:0; color: var(--ink); font-family: var(--body); line-height: 1.5; font-size: 17px;
         min-height: 100vh; min-height: 100dvh; overflow-x: hidden; position: relative; touch-action: manipulation; }
  /* Нічне небо + сітка «мапи мережі» */
  body::after { content:""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 45% at 12% 0%, rgba(53,224,240,.20), transparent 70%),
      radial-gradient(55% 45% at 100% 100%, rgba(255,116,184,.18), transparent 70%),
      linear-gradient(170deg, var(--bg1), var(--bg2)); }
  body::before { content:""; position: fixed; inset: -50% -50%; z-index: 0; pointer-events:none; opacity:.75;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 140px 90px, #cfd8ff, transparent),
      radial-gradient(1.5px 1.5px at 80px 160px, #fff, transparent), radial-gradient(2px 2px at 200px 40px, #ffe7a3, transparent),
      radial-gradient(1.5px 1.5px at 260px 140px, #fff, transparent);
    background-size: 300px 220px; animation: drift 120s linear infinite; }
  @keyframes drift { to { transform: translate3d(-300px, -220px, 0); } }
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; }
  h1 { font-size: clamp(1.55rem, 5.2vw, 2.25rem); line-height: 1.12; margin: 6px 0 8px; font-weight: 800; text-wrap: balance; }
  h2 { font-size: 1.15rem; font-weight: 700; margin: 22px 0 12px; }
  h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
  p { margin: 0 0 10px; }
  .lead { color: var(--muted); max-width: 62ch; }
  .muted { color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px;
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:12px; }
  .ico { display:inline-block; width: 48px; height: 48px; flex: none; color: var(--c, #fff); }
  .ico svg { width:100%; height:100%; display:block; }
  .ico.lg { width: 72px; height: 72px; } .ico.sm { width: 38px; height: 38px; }
  .stars { font-size: 1.5rem; letter-spacing: 2px; color: var(--yellow); white-space: nowrap; text-shadow: 0 0 10px rgba(255,216,74,.5); }
  .stars .off { color: rgba(255,255,255,.18); text-shadow:none; }
  .stars .pop { display:inline-block; animation: pop .5s ease both; }
  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .btn { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .01em; padding: 13px 20px; border-radius: 16px; border: 0; cursor: pointer;
         background: var(--accent); color: var(--accent-ink); min-height: 52px; box-shadow: 0 5px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s, filter .15s; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-deep); }
  .btn.alt { background: var(--card2); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.3); border: 1px solid var(--line); }
  .btn.alt:active { box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .btn.ok { background: var(--green); color:#052e14; box-shadow: 0 5px 0 #1f8f55; } .btn.bad { background: var(--red); color:#3a0512; box-shadow: 0 5px 0 #b63753; }
  .btn.big { width: 100%; font-size: 1.02rem; }
  .btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }
  input[type=text], input[type=password], select { font: inherit; font-size: 16px; font-weight: 600; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-hi); background: rgba(5,4,25,.45); color: var(--ink); min-width: 0; flex: 1 1 140px; min-height: 52px; }
  input::placeholder { color: rgba(183,188,232,.75); }
  input:focus, select:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px rgba(53,224,240,.25); }
  select option { color: #111; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; font-family: var(--display); font-size: .95rem; }
  .topbar .muted { font-family: var(--body); }
  svg.net { width: 100%; max-width: 520px; display:block; margin: 0 auto 6px; }

  /* Талісман */
  .mascot { display:flex; align-items:flex-end; gap:10px; margin: 6px 0 14px; }
  .mascot svg { width: 84px; height: 96px; flex: none; filter: drop-shadow(0 6px 14px rgba(53,224,240,.35)); }
  .bubble { position: relative; background: #fff; color:#1b1740; padding: 12px 16px; border-radius: 18px 18px 18px 6px; font-weight: 700; flex: 1; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .bubble::before { content:""; position:absolute; left:-8px; bottom: 14px; border: 8px solid transparent; border-right-color:#fff; border-left:0; }
  .eye { transform-origin: center; animation: blink 4.5s infinite; } @keyframes blink { 0%,94%,100% { transform: scaleY(1);} 97% { transform: scaleY(.1);} }
  .ant { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.35; } }
  .bob { animation: bob 3s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-4px); } }

  /* Карта місії: рівні з'єднані пунктирним маршрутом */
  .map { position: relative; }
  .map::before { content:""; position:absolute; left: 42px; top: 34px; bottom: 34px; width: 4px; border-radius: 2px; z-index: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.35) 0 7px, transparent 7px 15px); }
  .lv { position: relative; z-index: 1; display:flex; align-items:center; gap:14px; width:100%; text-align:left; color: var(--ink); font-family: var(--body);
        background: rgba(22,18,66,.82); border:1px solid var(--line); border-radius: 20px; padding: 12px 14px 12px 13px; cursor:pointer; min-height: 80px; transition: border-color .15s, transform .08s; }
  .lv:hover:not(:disabled) { border-color: var(--line-hi); }
  .lv:active:not(:disabled) { transform: scale(.985); }
  .lv .badge { position: relative; width: 58px; height: 58px; border-radius: 18px; display:flex; align-items:center; justify-content:center; flex:none; background: var(--bgc); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .lv .badge .ico { width: 36px; height: 36px; color: #12102e; }
  .lv .lvnum { position:absolute; top: -7px; left: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #fff; color: #1b1740; font-family: var(--display); font-weight: 800; font-size: .72rem; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .lv b { display:block; font-family: var(--display); font-weight: 700; font-size: .98rem; line-height: 1.25; margin-bottom: 2px; }
  .lv small { color: var(--muted); display:block; line-height:1.3; font-size: .9rem; }
  .lv .meta { margin-left:auto; text-align:right; }
  .lv .stars { font-size: 1.15rem; }
  .lv.done { cursor: default; background: rgba(22,18,66,.6); }
  .lv.done .badge { filter: saturate(.45) brightness(.85); }
  .lv.done .lvnum { background: var(--green); color: #052e14; }
  .lv.next { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 26px rgba(53,224,240,.28); }
  .lv.next .badge::after { content:""; position:absolute; inset:-6px; border-radius: 22px; border: 2px solid var(--cyan); animation: ring 1.8s ease-out infinite; }
  @keyframes ring { from { opacity: .9; transform: scale(.92); } to { opacity: 0; transform: scale(1.18); } }
  .xp { height: 14px; background: rgba(0,0,0,.35); border-radius: 8px; overflow:hidden; border:1px solid var(--line); }
  .xp > i { display:block; height:100%; background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow)); transition: width .5s; }

  /* Сторінка з підручника: білий аркуш, приклеєний скотчем */
  .paper { position: relative; margin: 14px 0 16px; padding: 10px; background: #fff; border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.4); color: #3b3f66; }
  .paper img { display:block; width:100%; height:auto; border-radius: 6px; }
  .paper figcaption { font-size: .8rem; line-height: 1.35; padding: 8px 4px 2px; color: #5d6290; }
  figure.paper { margin-left: 0; margin-right: 0; }
  .paper.lead-fig { transform: rotate(-.6deg); margin-top: 22px; }
  .paper.lead-fig::before { content:""; position:absolute; top:-12px; left: 50%; width: 110px; height: 24px; transform: translateX(-50%) rotate(-3deg);
    background: rgba(255,216,74,.78); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .zoomwrap { padding: 6px; margin: 0 0 12px; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .zoom { aspect-ratio: 16 / 9; background-repeat: no-repeat; border-radius: 7px; background-color: #fff; }

  /* Карусель */
  .car { position: relative; margin: 4px -16px 12px; }
  .car-track { display:flex; overflow-x:auto; scroll-snap-type: x mandatory; gap: 12px; padding: 4px 16px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .car-track::-webkit-scrollbar { display:none; }
  .slide { flex: 0 0 88%; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 12px 12px 14px; }
  .slide svg.art, .slide .media { width: 100%; height: auto; display:block; border-radius: 14px; background: rgba(0,0,0,.28); margin-bottom: 8px; }
  .slide .media { aspect-ratio: 16/9; object-fit: contain; }
  .slide img.media { background: #fff; padding: 6px; }
  .slide p { font-size: .98rem; margin: 0 0 6px; }
  .dots { display:flex; justify-content:center; gap:8px; margin-top: 2px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.28); transition: all .2s; }
  .dots i.on { background: var(--cyan); width: 22px; border-radius: 6px; }
  .car-nav { display:flex; justify-content:space-between; align-items:center; padding: 0 16px; }
  .vids { display:grid; gap:10px; }
  a.vid { display:flex; gap:12px; align-items:center; color: var(--ink); text-decoration:none; background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 10px 12px; min-height: 64px; }
  a.vid .play { width: 44px; height: 44px; border-radius: 50%; background: var(--red); display:flex; align-items:center; justify-content:center; flex:none; }
  a.vid .play::after { content:""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
  a.vid small { color: var(--muted); display:block; }

  /* Ігрові елементи */
  .bigq { font-size: 1.2rem; font-weight: 800; display:flex; align-items:center; gap: 12px; min-height: 100px; }
  .fb { min-height: 28px; font-weight: 800; margin: 10px 0; }
  .fb.ok { color: var(--green); } .fb.bad { color: var(--red); }
  .bar { height: 12px; background: rgba(0,0,0,.35); border-radius: 8px; overflow:hidden; margin: 6px 0 12px; }
  .bar > i { display:block; height:100%; width:100%; background: linear-gradient(90deg, var(--green), var(--yellow), var(--red)); background-size: 300% 100%; transition: width .1s linear; }
  .tile { background: var(--card2); border:2px solid var(--line); border-radius:15px; padding:10px 14px; cursor:pointer; color: var(--ink); text-align:left; min-height: 56px; display:flex; align-items:center; gap:10px; font-weight: 700; transition: border-color .12s, background .12s; }
  .tile:hover { border-color: var(--line-hi); }
  .tile.col { flex-direction: column; justify-content:center; text-align:center; }
  .tile.sel { background: rgba(255,216,74,.2); border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255,216,74,.18); }
  .tile.done { border-color: var(--green); background: rgba(88,227,154,.14); opacity:.8; cursor: default; }
  .tile.wrong { animation: shake .35s; border-color: var(--red); }
  .n, .tile .n { display:inline-flex; align-items:center; justify-content:center; min-width: 28px; height: 28px; border-radius: 50%; background: var(--yellow); color:#3a2c00; font-weight:800; flex:none; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .cats { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top: 12px; }
  .cat { border:2px dashed var(--cyan); border-radius:16px; padding:14px 8px; text-align:center; font-weight:800; cursor:pointer; background: rgba(53,224,240,.08); color: var(--ink); min-height: 60px; }
  .cat.wrong { animation: shake .35s; border-color: var(--red); background: rgba(255,111,138,.25); }
  .items { display:flex; flex-wrap:wrap; gap:8px; }
  .items .tile { text-align:center; justify-content:center; }
  .gradebox { text-align:center; }
  .grade { font-family: var(--display); font-size: 4.4rem; font-weight: 800; line-height: 1; background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rank { font-family: var(--display); font-size: 1.5rem; font-weight: 700; margin: 8px 0 8px; }
  .srow { display:flex; justify-content:space-between; align-items:center; gap:8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
  .tabs .btn { flex: 1 1 60px; padding: 10px; }
  .tabs .btn.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
  .tbl { width:100%; border-collapse: collapse; font-size: .98rem; }
  .tbl th, .tbl td { text-align:left; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .tbl th { color: var(--muted); font-weight: 700; }
  .tbl tr.me td { background: rgba(53,224,240,.18); font-weight: 800; }
  .medal { font-weight: 900; }
  .warn { background: rgba(255,216,74,.14); border: 1px solid var(--yellow); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; }
  footer { color: var(--muted); font-size: .85rem; text-align:center; padding: 22px 0 10px; }
  footer a { color: var(--muted); }
  .credit { color: var(--ink); font-weight: 700; }
  #confetti { position: fixed; inset:0; z-index: 50; pointer-events:none; }
  /* Заголовок рівня */
  .ltop { display:flex; align-items:center; gap:12px; margin: 2px 0 14px; }
  .lt-badge { width: 50px; height: 50px; border-radius: 15px; background: var(--bgc); display:flex; align-items:center; justify-content:center; flex:none; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .lt-badge .ico { width: 32px; height: 32px; color: #12102e; }
  .lt-txt { flex: 1; min-width: 0; }
  .lt-txt small { display:block; color: var(--muted); font-weight: 700; font-size: .82rem; }
  .lt-txt b { display:block; font-family: var(--display); font-size: 1.12rem; line-height: 1.2; margin-top: 2px; }
  .lt-lock { font-size: .72rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .par, .part { display:inline-block; font-family: var(--display); font-size: .66rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.13); color: var(--ink); margin-right: 6px; vertical-align: 1px; }
  .part { background: var(--yellow); color: #3a2c00; margin: 0 0 0 6px; }
  @media (max-width: 420px) { .lt-lock { display:none; } }

  /* Запитання */
  .qhead { font-size: .9rem; color: var(--cyan); margin: 20px 0 8px; }
  .card.q { padding: 14px; }
  .qtitle { display:flex; gap:10px; align-items:flex-start; margin-bottom: 10px; }
  .qtitle b { flex: 1; line-height: 1.35; }
  .qn { min-width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.14); display:inline-flex; align-items:center; justify-content:center; font-family: var(--display); font-size: .72rem; font-weight: 700; flex:none; }
  .photo { padding: 8px; margin: 0 0 12px; display:flex; justify-content:center; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .photo img { width: auto; max-width: 100%; max-height: 170px; }

  /* Пошуковий рядок як варіант відповіді */
  .qbar { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#fff; color:#1b1740; border: 2px solid #dfe3ff; border-radius: 999px; padding: 10px 18px; min-height: 52px; font-weight: 700; cursor:pointer; }
  .qbar-ico { width: 22px; height: 22px; color: #7c80b5; flex:none; }
  .qbar-ico svg { width:100%; height:100%; display:block; }
  .qbar.sel { border-color: #e2b900; box-shadow: 0 0 0 4px rgba(255,216,74,.5); }

  /* Адресний рядок із доменами */
  .addr { display:flex; align-items:center; flex-wrap:wrap; gap:4px; background:#fff; color:#1b1740; border-radius: 18px; padding: 10px 16px; font-size: 1.2rem; font-weight: 800; }
  .addr-pre, .addr-dot { color: #9aa0c8; font-weight: 700; }
  .addr-part { font: inherit; border: 2px dashed #b9bfe6; background: #f3f4ff; color: #1b1740; border-radius: 10px; padding: 4px 12px; min-height: 44px; cursor:pointer; }
  @media (max-width: 420px) { .addr { font-size: 1rem; padding: 8px 10px; } .addr-part { padding: 4px 8px; } }
  .tile.pic .picbox { width: 88px; height: 64px; background:#fff; border-radius: 9px; display:flex; align-items:center; justify-content:center; }
  .tile.pic .picbox .ico { width: 44px; height: 44px; }
  .tile.pic.in .picbox { width: 56px; height: 42px; } .tile.pic.in .picbox .ico { width: 30px; height: 30px; }
  .addr-part.sel { background: var(--yellow); border: 2px solid #c9a400; }

  /* Допис у соцмережі */
  .post { background:#fff; color:#1b1740; border-radius: 18px; padding: 14px; box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .post-head { display:flex; gap:10px; align-items:center; margin-bottom: 8px; }
  .post-ava { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d6d9f2, #9aa0c8); flex:none; }
  .post-head small { display:block; color:#7a7fa8; font-size: .8rem; }
  .frag { position: relative; display:block; width:100%; text-align:left; font: inherit; font-weight: 600; line-height: 1.4; background: transparent; color: inherit; border: 2px dashed transparent; border-radius: 12px; padding: 8px 10px 8px 34px; margin: 2px 0; cursor:pointer; }
  .frag::before { content:""; position:absolute; left: 10px; top: 11px; width: 14px; height: 14px; border-radius: 4px; border: 2px solid #c3c6e6; }
  .frag:hover { background: #f4f5ff; }
  .frag.sel { background: rgba(255,111,138,.14); border-color: #ff6f8a; }
  .frag.sel::before { background: #ff6f8a; border-color: #ff6f8a; }

  /* Картки з фото в сортуванні */
  .tile.pic { flex-direction: column; justify-content:center; gap: 6px; padding: 8px 10px; min-width: 104px; }
  .tile.pic img { width: 88px; height: 64px; object-fit: contain; background:#fff; border-radius: 9px; padding: 4px; }
  .tile.in { min-height: 44px; font-size: .92rem; padding: 6px 10px; }
  .tile.pic.in img { width: 56px; height: 42px; }
  .cat-name { font-family: var(--display); font-size: .88rem; }
  .cat.armed { border-style: solid; background: rgba(53,224,240,.16); }

/* ---------- Рушій 4. Розстав по порядку ----------

}

/* ---------- Рівень із кількох частин ---------- */
function playStages(done, id, stages) {

    var sub = id + '_' + P.k;
    stages[P.k](function (score) {
      P.sum += score; P.rows = P.rows.concat(getReview()[sub] || []); P.k++; setProg(id, P);
      setProg(sub, null); var rv = getReview(); delete rv[sub]; store('imi_review', JSON.stringify(rv));

function playBlitz(done, id, title) {
  var P = getProg(id) || { ids: shuffle(BLITZ.map(function (x, k) { return k; })).slice(0, BLITZ_N), i: 0, score: 0, open: false, rows: [] };
  if (!P.rows) P.rows = [];
  if (P.open) { var pq = BLITZ[P.ids[P.i]]; P.rows.push({ q: pq[0], mine: 'сторінку оновлено', right: pq[1] ? 'Правда' : 'Неправда', ok: false }); P.i++; P.open = false; }
  var qs = P.ids.map(function (k) { return BLITZ[k]; }), i = P.i, score = P.score, locked = false, left, box = h('div');
  setProg(id, P);
  function end() { stopTimers(); saveReview(id, P.rows); done(score); }
  function next() { i++; P.i = i; P.score = score; P.open = false; setProg(id, P); if (i >= qs.length) end(); else show(); }
  function show() {
    stopTimers(); locked = false; left = BLITZ_SEC; P.open = true; setProg(id, P);
    var q = qs[i], bar = h('i'), fb = h('div', { class: 'fb', 'aria-live': 'polite' });
    function answer(val, timeout) {
      if (locked) return; locked = true; stopTimers(); var ok = !timeout && val === q[1]; if (ok) score++;
      P.rows.push({ q: q[0], mine: timeout ? 'час вийшов' : (val ? 'Правда' : 'Неправда'), right: q[1] ? 'Правда' : 'Неправда', ok: ok }); P.score = score; P.open = false; setProg(id, P);
      fb.textContent = timeout ? 'Час вийшов.' : 'Відповідь прийнято.'; setTimeout(next, 600);
    }
    box.innerHTML = '';
    [h('div', { class: 'muted', text: 'Питання ' + (i + 1) + ' з ' + qs.length }),
     h('div', { class: 'bar' }, [bar]), h('div', { class: 'card bigq' }, [ico('bolt', 'lg', '#fb923c'), h('span', { text: q[0] })]),
     h('div', { class: 'row' }, [h('button', { class: 'btn ok', style: 'flex:1', text: 'Правда', onclick: function () { answer(true, false); } }), h('button', { class: 'btn bad', style: 'flex:1', text: 'Неправда', onclick: function () { answer(false, false); } })]), fb].forEach(function (n) { box.appendChild(n); });
    timers.push(setInterval(function () { left -= 0.1; bar.style.width = Math.max(0, left / BLITZ_SEC * 100) + '%'; if (left <= 0) answer(null, true); }, 100));
  }
  if (i >= qs.length) { saveReview(id, P.rows); done(score); return; }
  render([levelTop(title), h('p', { class: 'lead', text: 'На кожне твердження ' + BLITZ_SEC + ' секунд. Встигни відповісти: правда це чи ні. Якщо оновити сторінку, поточне питання зарахується як помилка.' }), box]); show();
}
